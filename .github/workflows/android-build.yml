name: Android Multi-ABI Build

concurrency:
  group: gi-koko-myanmar-open-world-armv7-interiors
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feature/survival-open-world-expansion
      - fix/redmi-9a-startup-diagnostics

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Godot source project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          zip -qr build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-source.zip . -x ".git/*" "build/*"
          test -s build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build packages
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Java 11 for Godot 3 export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Godot 3.5.2 headless
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/3.5.2-stable/Godot_v3.5.2-stable_linux_headless.64.zip -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN=$(find "$HOME/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          mv "$GODOT_BIN" "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          VERSION_OUTPUT=$("$HOME/godot/godot" --version 2>&1) || VERSION_STATUS=$?
          printf '%s\\n' "$VERSION_OUTPUT"
          if [[ "$VERSION_OUTPUT" != *"3.5.2.stable.official"* ]]; then
            echo "Godot 3.5.2 version check failed"
            exit 1
          fi
          echo "Godot version confirmed; continuing to project validation."

      - name: Install Godot 3.5.2 export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/templates/3.5.2.stable"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/3.5.2-stable/Godot_v3.5.2-stable_export_templates.tpz -o /tmp/godot-templates.tpz
          unzip -o /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/templates/3.5.2.stable/"
          cp /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/templates/3.5.2.stable/"

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -storetype JKS -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate every GDScript and import resources
        shell: bash
        run: |
          set -euxo pipefail
          timeout 600s godot --path . --script res://scripts/validate_scripts.gd > /tmp/gdscript-validation.log 2>&1 || { cat /tmp/gdscript-validation.log; exit 1; }
          cat /tmp/gdscript-validation.log
          timeout 600s godot --path . --editor --quit > /tmp/godot-validation.log 2>&1 || { cat /tmp/godot-validation.log; exit 1; }
          if grep -E "(Parse Error|SCRIPT ERROR|ERROR:.*(parse|load))" /tmp/godot-validation.log; then
            cat /tmp/godot-validation.log
            exit 1
          fi

      - name: Install desktop renderer for real startup smoke test
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          mkdir -p "$HOME/godot-desktop"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/3.5.2-stable/Godot_v3.5.2-stable_x11.64.zip -o /tmp/godot-desktop.zip
          unzip -o /tmp/godot-desktop.zip -d "$HOME/godot-desktop"
          DESKTOP_GODOT=$(find "$HOME/godot-desktop" -maxdepth 1 -type f -name 'Godot*' -print -quit)
          test -n "$DESKTOP_GODOT"
          chmod +x "$DESKTOP_GODOT"
          mv "$DESKTOP_GODOT" "$HOME/godot-desktop/godot"

      - name: Run startup smoke test (splash to main scene)
        shell: bash
        run: |
          set -euxo pipefail
          timeout 90s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$HOME/godot-desktop/godot" --path . --video-driver GLES2 --fixed-fps 30 --quit-after 240 > /tmp/godot-startup-smoke.log 2>&1 || { cat /tmp/godot-startup-smoke.log; exit 1; }
          cat /tmp/godot-startup-smoke.log
          if grep -E "(SCRIPT ERROR|Parse Error|Failed loading resource|Cannot open file|^ERROR:)" /tmp/godot-startup-smoke.log; then
            echo "Godot desktop-renderer startup smoke test reported an engine, script, or resource error"
            exit 1
          fi

      - name: Export Universal multi-ABI and Redmi 9A ARMv7 APKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          cp export_presets.cfg /tmp/export_presets.universal.cfg
          godot --path . --export-debug "Android" build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Universal.apk > /tmp/godot-export-universal.log 2>&1 || { cat /tmp/godot-export-universal.log; exit 1; }
          test -s build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Universal.apk
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          for abi in ("arm64-v8a", "x86", "x86_64"):
              s = s.replace(f"architectures/{abi}=true", f"architectures/{abi}=false")
          if "architectures/armeabi-v7a=true" not in s:
              raise SystemExit("ARMv7 architecture is not enabled")
          p.write_text(s)
          PY
          godot --path . --export-debug "Android" build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Redmi-9A-ARMv7.apk > /tmp/godot-export-armv7.log 2>&1 || { cat /tmp/godot-export-armv7.log; exit 1; }
          cp /tmp/export_presets.universal.cfg export_presets.cfg
          test -s build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Redmi-9A-ARMv7.apk
          for APK in build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Universal.apk build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Redmi-9A-ARMv7.apk; do
            SIZE=$(stat -c%s "$APK")
            echo "$APK SIZE_BYTES=$SIZE"
            if [ "$SIZE" -gt 314572800 ]; then echo "APK exceeds 300 MB target: $APK"; exit 1; fi
          done

      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Godot-Source
          path: build/*-source.zip
          if-no-files-found: error

      - name: Verify APK package, signatures, and Android ABIs
        shell: bash
        run: |
          set -euxo pipefail
          AAPT="$ANDROID_HOME/build-tools/30.0.3/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/30.0.3/apksigner"
          UNIVERSAL=build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Universal.apk
          REDMI=build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Redmi-9A-ARMv7.apk
          "$AAPT" dump badging "$UNIVERSAL" | sed -n '1,8p'
          "$APKSIGNER" verify "$UNIVERSAL"
          "$APKSIGNER" verify "$REDMI"
          unzip -Z1 "$UNIVERSAL" | grep -E "^lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/.*\\.so$" | sort -u > /tmp/universal-abis.txt
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -q "^lib/$ABI/" /tmp/universal-abis.txt || { echo "Universal APK missing ABI: $ABI"; exit 1; }
          done
          unzip -Z1 "$REDMI" | grep -E "^lib/armeabi-v7a/.*\\.so$" | grep -q .
          if unzip -Z1 "$REDMI" | grep -E "^lib/(arm64-v8a|x86|x86_64)/.*\\.so$"; then
            echo "Redmi 9A APK unexpectedly contains non-ARMv7 libraries"
            exit 1
          fi
          echo "Universal APK: all four ABIs verified"
          echo "Redmi 9A APK: armeabi-v7a only verified"

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Universal-Android-APK
          path: build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Universal.apk
          if-no-files-found: error

      - name: Upload Redmi 9A APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Redmi-9A-ARMv7-APK
          path: build/GI-KO-KO-MYANMAR-OPEN-WORLD-3D-Redmi-9A-ARMv7.apk
          if-no-files-found: error
